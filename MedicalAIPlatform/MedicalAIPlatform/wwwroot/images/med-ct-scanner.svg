<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Diagnostic CT imaging">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1D4581"/>
    </linearGradient>
    <radialGradient id="sglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#127FEC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#127FEC" stop-opacity="0"/>
    </radialGradient>
    <filter id="snoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0.08 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#sbg)"/>
  <rect width="960" height="600" fill="url(#sglow)"/>
  <g filter="url(#snoise)">
    <rect x="210" y="130" width="540" height="320" rx="28" fill="#111827" stroke="#127FEC" stroke-width="3"/>
    <circle cx="480" cy="290" r="118" fill="none" stroke="#38bdf8" stroke-width="10" opacity="0.75"/>
    <circle cx="480" cy="290" r="82" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="480" cy="285" rx="52" ry="58" fill="#475569" opacity="0.85"/>
    <ellipse cx="445" cy="278" rx="18" ry="24" fill="#94a3b8" opacity="0.8"/>
    <ellipse cx="515" cy="278" rx="18" ry="24" fill="#94a3b8" opacity="0.8"/>
    <rect x="390" y="88" width="180" height="44" rx="8" fill="#127FEC" opacity="0.9"/>
    <rect x="280" y="470" width="400" height="16" rx="8" fill="#334155"/>
  </g>
  <text x="480" y="565" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">DIAGNOSTIC CT</text>
</svg>
