<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Chest CT scan">
  <defs>
    <linearGradient id="ctbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="ctslice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <filter id="ctnoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0.12 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#ctbg)"/>
  <g filter="url(#ctnoise)">
    <circle cx="480" cy="300" r="210" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="480" cy="300" r="185" fill="url(#ctslice)"/>
    <ellipse cx="480" cy="290" rx="120" ry="135" fill="#334155" opacity="0.95"/>
    <ellipse cx="405" cy="280" rx="48" ry="62" fill="#94a3b8" opacity="0.9"/>
    <ellipse cx="555" cy="280" rx="48" ry="62" fill="#94a3b8" opacity="0.9"/>
    <ellipse cx="405" cy="280" rx="22" ry="30" fill="#cbd5e1" opacity="0.55"/>
    <ellipse cx="555" cy="280" rx="22" ry="30" fill="#cbd5e1" opacity="0.55"/>
    <path d="M480 155 L480 445 M335 300 L625 300" stroke="#475569" stroke-width="1.5" opacity="0.45"/>
    <circle cx="480" cy="300" r="28" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  </g>
  <rect x="640" y="72" width="250" height="150" rx="10" fill="rgba(15,23,42,0.85)" stroke="#127FEC" stroke-width="2"/>
  <polyline points="660,190 710,130 760,155 810,95 860,120 870,100" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="765" y="205" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">AXIAL CT</text>
</svg>
